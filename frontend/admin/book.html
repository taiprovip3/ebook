<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBOOK Admin - Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/toastr.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/ad778f42b3.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            margin-bottom: 20px;
        }
        .table {
            margin-top: 20px;
        }
        .modal-header {
            background-color: #343a40;
            color: white;
        }
        .modal-footer {
            justify-content: center;
        }
        .modal-footer .btn {
            width: 100px;
        }
        .action-btns i {
            cursor: pointer;
        }
        .action-btns i:hover {
            color: #0d6efd;
        }
        .search-bar {
            margin-bottom: 20px;
        }
        .fade {
            transition: opacity 0.1s ease-in-out;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="./homepage.html">EBOOK Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="accountDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Quản Lý Tài Khoản
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="accountDropdown">
                            <li><a class="dropdown-item" href="javascript:void(0);" data-bs-toggle="modal" data-bs-target="#userInfoModal">Xem Thông Tin Tài Khoản</a></li>
                            <li><a class="dropdown-item" href="javascript:void(0);" data-bs-toggle="modal" data-bs-target="#changePasswordModal">Đổi Mật Khẩu</a></li>
                            <li><a class="dropdown-item" href="javascript:void(0);" onclick="logout('admin');">Đăng xuất</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold text-white" href="javascript:void(0);">Quản Lý Sách</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./order.html">Quản Lý Hóa Đơn</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./statistic.html">Thống Kê</a>
                    </li>
                </ul>
                <!-- <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Tìm kiếm" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form> -->
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center">
            <h2>Book Management</h2>
            <div>
                <button type="button" class="btn btn-primary" onclick="addBook();">Add Book</button>
                <button id="deleteSelectedBtn" class="btn btn-danger">Xóa Chọn</button>
            </div>
        </div>
        <input type="text" id="searchBar" class="form-control search-bar" placeholder="Search books...">
        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th scope="col" class="align-middle"><input type="checkbox" id="selectAll"></th>
                    <th scope="col" class="align-middle text-center">ID</th>
                    <th scope="col" class="align-middle text-center">Title</th>
                    <th scope="col" class="align-middle text-center">Author</th>
                    <th scope="col" class="align-middle text-center">Publisher</th>
                    <th scope="col" class="align-middle text-center">Publication Date</th>
                    <th scope="col" class="align-middle text-center">Price</th>
                    <th scope="col" class="align-middle text-center">Discount</th>
                    <th scope="col" class="align-middle text-center">Stocks</th>
                    <th scope="col" class="align-middle text-center">Genre</th>
                    <th scope="col" class="align-middle text-center">Type</th>
                    <th scope="col" class="align-middle text-center">Flash Sale</th>
                    <th scope="col" class="align-middle text-center">CBM (LxWxHxW)</th>
                    <th scope="col" class="align-middle text-center">Cover Image</th>
                    <th scope="col" class="align-middle text-center">Actions</th>
                </tr>
            </thead>
            <tbody id="bookTable" class="small">
                <!-- Rows will be added here by JavaScript -->
            </tbody>
        </table>
        <!-- Pagination controls -->
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination links will be inserted here -->
            </ul>
        </nav>
    </div>













    <div id="modals-container"></div>
    <script src="../js/get-alias.js"></script>
    <script src="../js/calculate.js"></script>
    <script src="../js/format.js"></script>
    <script src="../js/logout.js"></script>
    <script>
        // Sample book data
        var books = [];
        var currentPage = 0;
        var pageSize = 20;

        async function getBooks(page, size) {
            return $.ajax({
                url: 'http://localhost:8080/api/v1/book/list',
                type: 'GET',
                data: { page, size },
                contentType: 'application/json',
                credentials: 'include', // Để gửi cookie trong request
            }).then((data) => data);
        }

        // Render books
        async function renderBooks(page, size) {
            const data = await getBooks(page, size);
            console.log('data=', data);
            $('#pagination').empty();

            const bookTable = $("#bookTable");
            bookTable.empty();
            
            books = data.content;

            books.forEach(book => {
                const row = `<tr class="text-center">
                    <td class="align-middle"><input type="checkbox" class="book-checkbox" data-id="${book.id}"></td>
                    <td class="align-middle">${book.id}</td>
                    <td class="align-middle">${book.title}</td>
                    <td class="align-middle">${book.author}</td>
                    <td class="align-middle">${book.publisher}</td>
                    <td class="align-middle">${formatDate(book.publicationDate)}</td>
                    <td class="align-middle">${formatVND(book.price)}</td>
                    <td class="align-middle">-${formatVND(book.discount)}</td>
                    <td class="align-middle">${book.stockQuantity}</td>
                    <td class="align-middle">${book.genre} (${genreTranslations[book.genre]})</td>
                    <td class="align-middle">${book.bookType}</td>
                    <td class="align-middle">${book.flashSale} đ<br>End in: ${formatDate(book.flashSaleExpired)}</td>
                    <td class="align-middle">${book.length}cm x ${book.width}cm x ${book.height}cm x ${book.weight} gram</td>
                    <td class="align-middle"><img src="${book.coverImageUrl}" widht="64" height="64" /></td>
                    <td class="action-btns align-middle">
                        <i class="fas fa-edit" data-id="${book.id}" onclick="editBook(${book.id})"></i>
                        <i class="fas fa-trash" data-id="${book.id}" onclick="deleteBook(${book.id})"></i>
                    </td>
                </tr>`;
                bookTable.append(row);
            });

            // Add pagination links
            for (let i = 0; i < data.totalPages; i++) {
                $('#pagination').append(`
                    <li class="page-item ${i === page ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i + 1}</a>
                    </li>
                `);
            }
        }

        // Add
        function addBook() {
            $("#bookId").val();// Reset id hidden input
            $("#bookForm").trigger('reset');// Reset form
            $("#coverImagePreview").attr('src', 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsi4Q8x3VIgIjK_ryjfc3YuybVTAfoAO2arw4zPycn4uEIu2Nt0Ney1MFLaMLnbgccT7g&usqp=CAU');
            $("#saveBookModal").modal('toggle');
        }

        function uploadImage(file) {
            const accessToken = sessionStorage.getItem('admin_access_token');
            const formData = new FormData();
            formData.append("file", file);

            return $.ajax({
                url: 'http://localhost:8080/api/v1/book/upload-image',
                type: 'POST',
                beforeSend: function (xhr) {
                    xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
                },
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    return response.url; // giả sử backend trả về URL của hình ảnh đã upload
                },
                error: function(error) {
                    toastr.error("Image upload failed");
                    console.error("Image upload error: ", error);
                    return null;
                }
            });
        }

        function saveBook() {
            const bookId = $("#bookId").val();
            if(bookId) {// Hàm update
                console.log('Là update...');
                saveBookData(null);
            } else {// Hàm save
                console.log('Là save...');
                const coverImageFile = $("#coverImage")[0].files[0];
                if (coverImageFile) {
                    uploadImage(coverImageFile).then(function(coverImageUrl) {
                        if (coverImageUrl) {
                            console.log('---=coverImageUrl=---', coverImageUrl);
                            saveBookData(coverImageUrl);
                        }
                    });
                } else {
                    saveBookData($("#coverImageUrl").val());
                }
            }
        }

        function saveBookData(coverImageUrl) {
            const bookId = $("#bookId").val();
            const book = {
                bookId: bookId ? parseInt(bookId) : books.length + 1,
                isbn: $("#isbn").val(),
                title: $("#title").val(),
                author: $("#author").val(),
                publisher: $("#publisher").val(),
                publicationDate: $("#publicationDate").val(),
                price: parseFloat($("#price").val()),
                description: $("#description").val(),
                coverImageUrl: coverImageUrl,
                stockQuantity: $("#stockQuantity").val(),
                discount: $("#discount").val(),
                flashSale: $("#flashSale").val(),
                flashSaleExpired: $("#flashSaleExpired").val(),
                genre: $("#genre").val(),
                bookType: $("#bookType").val(),
                length: $("#theLength").val(),
                width: $("#theWidth").val(),
                height: $("#theHeight").val(),
                weight: $("#theWeight").val(),
            };

            $.ajax({
                url: 'http://localhost:8080/api/v1/book/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(book),
                credentials: 'include', // Để gửi cookie trong request
                success: function(bookSaved) {
                    console.log('bookSaved=', bookSaved);
                    if (bookId) {
                        const index = books.findIndex(book => book.bookId === parseInt(bookId));
                        books[index] = book;
                    } else {
                        books.push(book);
                    }

                    $("#saveBookModal").modal("hide");
                    renderBooks();
                    toastr.success("Book saved successfully");
                },
                error: function(error) {
                    toastr.error("Save book error", 'Error!');
                    console.error("Save book error: ", error);
                    return null;
                }
            });
        }

        // Edit
        function editBook(bookId) {
            const book = books.find(book => book.id === bookId);
            console.log('book=', book);
            
            const publicationDate = new Date(book.publicationDate);
            const publicationFormattedDate = publicationDate.toISOString().split('T')[0];
            $("#bookId").val(book.id);
            $("#isbn").val(book.isbn);
            $("#title").val(book.title);
            $("#author").val(book.author);
            $("#publisher").val(book.publisher);
            $("#publicationDate").val(publicationFormattedDate);
            $("#price").val(book.price);
            $("#discount").val(book.discount);
            $("#description").val(book.description);
            $("#coverImageUrl").val(book.coverImageUrl);
            $("#coverImagePreview").attr('src', book.coverImageUrl);
            $("#stockQuantity").val(book.stockQuantity);

            $("#saveBookModal").modal("show");
        }

        // Delete
        function deleteBook(id) {
            if (confirm('Are you sure?') != true) {
                return;
            }
            $.ajax({
                url: `http://localhost:8080/api/v1/book/delete/${id}`,
                type: 'DELETE',
                contentType: 'application/json',
                credentials: 'include', // Để gửi cookie trong request
                success: function(booleanDeleted) {
                    console.log('booleanDeleted=', booleanDeleted);
                    if(!booleanDeleted) {
                        toastr.error("Book deleted failed", 'Error!');
                        return false;
                    }
                    books = books.filter(book => book.id !== id);
                    renderBooks();
                    toastr.success("Book deleted successfully");
                },
                error: function(error) {
                    toastr.error("Save book error", 'Error!');
                    console.error("Save book error: ", error);
                    return null;
                }
            });
        }

        // Delete many
        function deleteSelectedBooks() {
            const selectedIds = [];
            $(".book-checkbox:checked").each(function() {
                selectedIds.push(parseInt($(this).data("id")));
            });
            console.log('selectedIds=', selectedIds);
            if (selectedIds.length <= 0) {
                return;
            }
            $.ajax({
                url: 'http://localhost:8080/api/v1/book/deleteMany',
                type: 'DELETE',
                contentType: 'application/json',
                data: JSON.stringify(selectedIds),
                success: function(response) {
                    alert('Books deleted successfully!');
                    location.reload();
                },
                error: function(xhr, status, error) {
                    console.error('Error deleting books:', error);
                    toastr.error('An error occurred while deleting books', 'Error!');
                }
            });
        }

        // Search
        function searchBooks() {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            const filteredBooks = books.filter(book => {
                return (
                    book.title.toLowerCase().includes(searchTerm) ||
                    book.author.toLowerCase().includes(searchTerm) ||
                    book.publisher.toLowerCase().includes(searchTerm) ||
                    book.genre.toLowerCase().includes(searchTerm) ||
                    book.bookType.toLowerCase().includes(searchTerm)
                );
            });
            console.log('filteredBooks=', filteredBooks);
        }

        // Event listeners
        $(document).ready(function() {
            // 01. Kiểm tra token khi trang được tải
            const accessToken = sessionStorage.getItem('admin_access_token');
            if (!accessToken) {
                window.location.href = './login.html';
            }

            // 02. Lấy data user
            $.ajax({
                url: 'http://localhost:8080/api/v1/user/whoiam',
                type: 'GET',
                beforeSend: function (xhr) {
                    xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
                },
                credentials: 'include', // Để gửi cookie trong request
                success: function(userData) {
                    console.log('response=', userData);
                    // Cập nhật dữ liệu vào các trường thông tin trong modal
                    $('#userId').text(`#${userData.id}`);
                    $('#userFirstName').text(userData.firstName);
                    $('#userLastName').text(userData.lastName);
                    $('#userFullName').text(`${userData.firstName} ${userData.lastName}`);
                    $('#userName').text(userData.username);
                    $('#userEmail').text(userData.email);
                    $('#userCreatedAt').text(formatDate(userData.createdAt));
                    $('#userAddress').text(userData.address || 'Chưa có thông tin'); // Thay đổi nếu có thông tin địa chỉ
                    $('#userPhoneNumber').text(`(+84) ${userData.phoneNumber || 'Chưa có thông tin'}`); // Thay đổi nếu có thông tin số điện thoại
;                },
                error: function(xhr, status, error) {
                    toastr.error('http://localhost:8080/api/v1/users/me error.');
                }
            });

            // 03. Load modals
            $.when(
                $.get("../modals/change-password-modal.html", function(data) {
                    $("#modals-container").append(data);
                }),
                $.get("../modals/user-info-modal.html", function(data) {
                    $("#modals-container").append(data);
                }),
                $.get("../modals/save-book-modal.html", function(data) {
                    $("#modals-container").append(data);
                }),
            ).done(function() {
                console.log("Tất cả các modal đã được tải xong");
            }).fail(function() {
                console.log("Lỗi khi tải modal");
            });

            // 04. Render books
            renderBooks(currentPage, pageSize);

            // 05. Event listener
            $("#saveBookBtn").click(saveBook);
            $("#deleteSelectedBtn").click(deleteSelectedBooks);

            $("#searchBar").on("input", function() {
                const query = $(this).val().toLowerCase();
                $("#bookTable tr").each(function() {
                    const bookId = $(this).find("td:nth-child(2)").text().toLowerCase();
                    const title = $(this).find("td:nth-child(3)").text().toLowerCase();
                    const author = $(this).find("td:nth-child(4)").text().toLowerCase();
                    const publisher = $(this).find("td:nth-child(5)").text().toLowerCase();
                    const publicationDate = $(this).find("td:nth-child(6)").text().toLowerCase();
                    const price = $(this).find("td:nth-child(7)").text().toLowerCase();
                    const discount = $(this).find("td:nth-child(8)").text().toLowerCase();
                    const stockQuantity = $(this).find("td:nth-child(9)").text().toLowerCase();
                    const genre = $(this).find("td:nth-child(10)").text().toLowerCase();
                    const bookType = $(this).find("td:nth-child(11)").text().toLowerCase();
                    const flashSale = $(this).find("td:nth-child(12)").text().toLowerCase();
                    const flashSaleExpired = $(this).find("td:nth-child(13)").text().toLowerCase();

                    if (title.includes(query) ||
                        author.includes(query) ||
                        publisher.includes(query) ||
                        publicationDate.includes(query) ||
                        price.includes(query) ||
                        discount.includes(query) ||
                        stockQuantity.includes(query) ||
                        genre.includes(query) ||
                        bookType.includes(query) ||
                        flashSale.includes(query) || 
                        flashSaleExpired.includes(query)) {
                        $(this).fadeIn();
                    } else {
                        $(this).fadeOut();
                    }
                });
            });

            $("#selectAll").change(function() {
                $(".book-checkbox").prop("checked", $(this).prop("checked"));
            });

            // 06. Handle pagination click
            $(document).on('click', '.page-link', function(e) {
                e.preventDefault();
                const page = $(this).data('page');
                currentPage = page;
                renderBooks(currentPage, pageSize);
            });
        });
    </script>
</body>
</html>
