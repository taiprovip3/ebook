        .chart-container {
            position: relative;
            height: 300px;
        }

        #revenueChart, #topSellingChart {
            width: 100%;

        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12">
                <h2 class="text-center">EBookStore Statistics</h2>

                <div class="statistic-container">
                    <!-- Div 1: Revenue Chart -->
                    <div class="statistic-box">
                        <div class="chart-header">
                            <h4>Revenue Statistics</h4>
                            <select id="yearSelect" class="form-select w-auto">
                               <!-- Options will be populated dynamically -->
                            </select>
                        </div>
                        <div class="chart-container">
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>

                    <!-- Div 2: Placeholder for future stats -->
                    <div class="statistic-box">
                        <div class="chart-header">
                            <h4 class="card-title">Top Selling Books</h4>
                        </div>
                        <div class="chart-container">
                            <canvas id="topSellingChart"></canvas>
                        </div>
                    </div>
                    <!-- Div 3: Placeholder for future stats -->

    <div id="modals-container"></div>
    <script src="../js/get-alias.js"></script>
    <script src="../js/calculate.js"></script>
    <script src="../js/format.js"></script>
    <script src="../js/logout.js"></script>
    <script>
        var orders;
        $(document).ready(async function() {
            // 01. Kiểm tra token khi trang được tải
            const accessToken = sessionStorage.getItem('admin_access_token');
            if (!accessToken) {
                window.location.href = './login.html';
            }

            // 02. Lấy data user
            $.ajax({
                url: 'http://localhost:8080/api/v1/user/whoiam',
                type: 'GET',
                beforeSend: function (xhr) {
                    xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
                },
                credentials: 'include', // Để gửi cookie trong request
                success: function(userData) {
                    console.log('response=', userData);
                    // Cập nhật dữ liệu vào các trường thông tin trong modal
                    $('#userId').text(`#${userData.id}`);
                    $('#userFirstName').text(userData.firstName);
                    $('#userLastName').text(userData.lastName);
                    $('#userFullName').text(`${userData.firstName} ${userData.lastName}`);
                    $('#userName').text(userData.username);
                    $('#userEmail').text(userData.email);
                    $('#userCreatedAt').text(formatDate(userData.createdAt));
                    $('#userAddress').text(userData.address || 'Chưa có thông tin'); // Thay đổi nếu có thông tin địa chỉ
                    $('#userPhoneNumber').text(`(+84) ${userData.phoneNumber || 'Chưa có thông tin'}`); // Thay đổi nếu có thông tin số điện thoại
;                },
                error: function(xhr, status, error) {
                    toastr.error('http://localhost:8080/api/v1/users/me error.');
                }
            });

            // 03. Load modals
            $.when(
                $.get("../modals/change-password-modal.html", function(data) {
                    $("#modals-container").append(data);
                }),
                $.get("../modals/user-info-modal.html", function(data) {
                    $("#modals-container").append(data);
                }),
                $.get("../modals/cancel-order-modal.html", function(data) {
                    $("#modals-container").append(data);
                }),
            ).done(function() {
                console.log("Tất cả các modal đã được tải xong");
            }).fail(function() {
                console.log("Lỗi khi tải modal");
            });


            // 04. Statistic revenue
                // Fake data for different years
                // const revenueData = {
                //     2023: [1200, 900, 1500, 2000, 1800, 2200, 2400, 2100, 1700, 1300, 1600, 1900],
                //     2022: [1000, 1100, 1200, 1600, 1400, 1500, 1700, 1600, 1200, 1300, 1400, 1500],
                //     2021: [800, 700, 900, 1100, 950, 1200, 1300, 1200, 800, 900, 1100, 1250]
                // };

            // Initialize Chart
            const ctx = document.getElementById('revenueChart').getContext('2d');
            let revenueChart;
            function renderChart(data) {
                if (revenueChart) {
                    revenueChart.destroy();
                }
                revenueChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                        datasets: [
                            {
                                type: 'bar', // Biểu đồ cột
                                label: 'Revenue (VND)',
                                data: data,
                                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 1
                            },
                            {
                                type: 'line', // Biểu đồ đường
                                label: 'Revenue Trend',
                                data: data,
                                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                borderColor: 'rgba(255, 99, 132, 1)',
                                borderWidth: 2,
                                fill: false, // Không tô màu dưới đường
                                tension: 0.1 // Đường cong mượt
                            }
                        ]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Total Revenue (VND)'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Month'
                                }
                            }
                        }
                    }
                });
            }
            function fetchYears() {
                const accessToken = sessionStorage.getItem('admin_access_token');
                $.ajax({
                    url: 'http://localhost:8080/api/v1/order/years',
                    method: 'GET',
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
                    },
                    credentials: 'include', // Để gửi cookie trong request
                    success: function (years) {
                        const yearSelect = $('#yearSelect');
                        yearSelect.empty();

                        years.forEach(function (year) {
                            yearSelect.append(new Option(year, year));
                        });
                        const currentYear = Math.max(...years);
                        yearSelect.val(currentYear);
                        fetchRevenueData(currentYear);
                    }
                });
            }
            function fetchRevenueData(year) {
                const accessToken = sessionStorage.getItem('admin_access_token');
                $.ajax({
                    url: 'http://localhost:8080/api/v1/order/revenue',
                    method: 'GET',
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
                    },
                    data: { year: year },
                    success: function (revenueData) {
                        // Convert object to array to match Chart.js data format
                        const data = [];
                        for (let i = 1; i <= 12; i++) {
                            data.push(revenueData[i] || 0);
                        }
                        renderChart(data);
                    }
                });
            }
            // Update chart when year selection changes
            $('#yearSelect').on('change', function () {
                const selectedYear = $(this).val();
                fetchRevenueData(selectedYear);
                // revenueChart.data.datasets[0].data = revenueData[selectedYear];
                // revenueChart.update();
            });
            fetchYears();

            // 05. Statistic topSoldOfBooks
            const ctxTopSelling = document.getElementById('topSellingChart').getContext('2d');
            let topSellingChart;

            function renderTopSellingChart(data) {
                if (topSellingChart) {
                    topSellingChart.destroy();
                }

                const labels = data.map(item => item.title);
                const quantities = data.map(item => item.totalSold);

                topSellingChart = new Chart(ctxTopSelling, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Total Sold',
                            data: quantities,
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Quantity Sold'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Book Titles'
                                }
                            }
                        }
                    }
                });
            }

            function fetchTopSellingBooks() {
                const accessToken = sessionStorage.getItem('admin_access_token');
                $.ajax({
                    url: 'http://localhost:8080/api/v1/book/top-selling',
                    method: 'GET',
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
                    },
                    credentials: 'include', // Để gửi cookie trong request
                    success: function (data) {
                        renderTopSellingChart(data);
                    }
                });
            }

            fetchTopSellingBooks();
        });
    </script>
</body>
